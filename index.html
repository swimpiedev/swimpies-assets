<!DOCTYPE html>
<!--
    ============================================================
    SWIMPIE'S ASSETS - WEBSITE
    ============================================================
    "Cut Dev Time. Not Your Budget."

    This file contains the page structure. Styling, site configuration,
    the website engine and asset data live in separate files and folders.

    HOW TO FIND YOUR WAY AROUND (Ctrl+F these):
      SITE CONFIGURATION     : site name, slogan, logo, currency, links
      SITE CONTENT           : all editable text (homepage, contact...)
      HOMEPAGE CONFIGURATION : show/hide homepage sections
      CATEGORIES             : the category database
      ASSETS                 : the asset database (sales, changelogs + docs)
      FEATURED ASSETS        : homepage featured asset IDs
      DOCUMENTATION DATA     : documentation templates & reference
      CHANGELOG TEMPLATE     : changelog template & reference
      WEBSITE LOGIC          : the engine (rendering, filters, routing)

    You normally only edit the sections ABOVE the "WEBSITE LOGIC"
    banner. A full configuration guide is provided alongside this file.
    ============================================================
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swimpie's Assets</title>
    <meta name="description" content="Swimpie's Assets: Unity assets that cut dev time, not your budget. Tools, systems, VFX, SFX and more, priced for indie developers.">

    <!-- Favicon: filled in automatically from siteConfig.logo in the script below. -->
    <link id="faviconLink" rel="icon" type="image/png">

    <!-- Fonts: Space Grotesk (headings, buttons, prices), IBM Plex Sans (body),
         JetBrains Mono (code). Loaded from Google Fonts, with system fallbacks
         so the site still works offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <a class="skip-link" href="#app">Skip to main content</a>

    <!-- The header and footer are filled in by the website engine
         (see renderHeader / renderFooter in the script below). -->
    <header class="site-header" id="siteHeader"></header>

    <!-- Every page (home, assets, asset detail, documentation, changelog,
         contact) is rendered into this element based on the current URL. -->
    <main class="site-main" id="app"></main>

    <footer class="site-footer" id="siteFooter"></footer>

    <noscript>
        <div style="max-width: 640px; margin: 60px auto; padding: 0 24px; font-family: sans-serif; text-align: center;">
            <h1>JavaScript is required</h1>
            <p>This website renders its content dynamically. Please enable JavaScript to view it.</p>
        </div>
    </noscript>

    <script src="config.js"></script>
    <script src="engine.js"></script>
</body>
</html>
